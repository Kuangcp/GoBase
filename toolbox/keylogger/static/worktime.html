<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Work Time</title>

    <script src="/s/js/lib/jquery.min.js"></script>
    <script src="/s/js/lib/echarts.min.js"></script>

    <script src="/s/js/chart.js"></script>
    <link rel="stylesheet" href="/s/css/common.css">
</head>

<style>
    .calendar-map {
        width: 100%;
    }
</style>

<body>
<nav class="nav">
    <button onclick="window.location='/s'">首页</button>
    <button onclick="window.location='/s/calendar.html'">年视图</button>
    <button onclick="window.location='/s/weeks.html'">每周热力图</button>
</nav>
<div id="calendarMap" class="calendar-map"></div>

<script>
    option = {
        title: {
            top: 15,
            left: 'center',
            text: '每日工时 (小时)'
        },
        tooltip: {
            position: 'top',
            formatter: function (p) {
                let format = echarts.format.formatTime('yyyy-MM-dd', p.data[0]);
                let hours = (p.data[1] / 60).toFixed(1);
                return format + ': ' + hours + 'h';
            }
        },
    };

    handleGet('/workTimeCalendar', function (response) {
        let calendar = []
        let topVal = -140

        let maxVal = response.data.max
        let pieces = []
        if (maxVal > 0) {
            let rawStep = maxVal / 7
            let step = Math.ceil(rawStep / 30) * 30
            if (step < 30) step = 30
            for (let i = 0; i < 7; i++) {
                pieces.push({min: Math.round(i * step), max: Math.round((i + 1) * step)})
            }
        }

        for (let idx in response.data.styles) {
            topVal += 220
            calendar.push({
                left: '17%',
                right: 30,
                top: topVal,
                height: 170,
                width: 1300,
                cellSize: ['auto', 13],
                range: response.data.styles[idx].range,
                itemStyle: {
                    borderWidth: 4.1
                },
                yearLabel: {show: true},
                backgroundColor: '#fff'
            })
        }
        option.calendar = calendar
        document.getElementById("calendarMap").style.height = (calendar.length * 230) + 'px'
        option.series = response.data.maps

        option.visualMap = {
            min: 0,
            max: maxVal,
            calculable: true,
            orient: 'vertical',
            top: 'left',
            formatter: function (v) {
                return (v / 60).toFixed(1) + 'h';
            },
            inRange: {
                color: ['#edffe9', '#dcffd3', '#bbffab',
                    '#9be9a8', '#40c463', '#30a14e', '#216e39'
                ]
            }
        }

        let chart = echarts.init(document.getElementById('calendarMap'));
        chart.setOption(option)
    })
</script>
</body>
</html>
