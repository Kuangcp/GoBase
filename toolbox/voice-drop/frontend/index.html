<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Voice Drop</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4A90D9">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100dvh;
    padding: 0 24px;
  }
  .container {
    max-width: 400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  .input-area {
    margin-top: 30dvh;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  textarea {
    width: 100%;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #16213e;
    color: #eee;
    font-size: 18px;
    outline: none;
    font-family: inherit;
    resize: none;
    min-height: 60px;
    max-height: 150px;
  }
  textarea:focus { border-color: #4A90D9; }
  textarea::placeholder { color: #555; }
  .send-btn {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: #4A90D9;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .send-btn:active { background: #357ABD; }
  .send-btn:disabled { opacity: 0.4; }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #555;
    min-height: 18px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }
  .status-dot.connected { background: #2ecc71; }
  .status-dot.recording { background: #e74c3c; animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .feedback {
    font-size: 14px;
    min-height: 20px;
  }
  .feedback.ok { color: #2ecc71; }
  .feedback.err { color: #e74c3c; }
  .history {
    flex: 1;
    margin-top: 16px;
    overflow-y: auto;
    list-style: none;
    min-height: 0;
    padding-bottom: 24px;
  }
  .history li {
    padding: 8px 0;
    border-bottom: 1px solid #2a2a4a;
    font-size: 15px;
    line-height: 1.5;
    color: #ccc;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="container">
  <div class="input-area">
    <textarea id="textInput" placeholder="输入文字..." rows="2"></textarea>
    <button class="send-btn" id="sendBtn">发送</button>
    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <ul class="history" id="history"></ul>
</div>

<script>
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const feedbackEl = document.getElementById('feedback');
const historyEl = document.getElementById('history');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

const MAX_HISTORY = 20;
let ws = null;
let recognition = null;
let isRecording = false;
let finalTranscript = '';
let wsReconnectTimer = null;

function truncate(s, n) {
  if (s.length <= n) return s;
  return s.slice(0, n) + '…';
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem('history') || '[]'); } catch { return []; }
}

function saveHistory(items) {
  localStorage.setItem('history', JSON.stringify(items));
}

function renderHistory(items) {
  historyEl.innerHTML = '';
  for (const text of items) {
    const li = document.createElement('li');
    li.textContent = truncate(text, 60);
    historyEl.appendChild(li);
  }
}

function addHistory(text) {
  const items = loadHistory();
  items.unshift(text);
  if (items.length > MAX_HISTORY) items.length = MAX_HISTORY;
  saveHistory(items);
  renderHistory(items);
}

renderHistory(loadHistory());

function setStatus(state, text) {
  statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  statusText.textContent = text;
}

function connectWS() {
  if (wsReconnectTimer) {
    clearTimeout(wsReconnectTimer);
    wsReconnectTimer = null;
  }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');

  ws.onopen = () => setStatus('connected', '已连接');

  ws.onclose = () => {
    setStatus('', '未连接');
    ws = null;
    wsReconnectTimer = setTimeout(connectWS, 3000);
  };

  ws.onerror = () => { ws.close(); };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.cmd === 'start_recording') startRecording();
      else if (msg.cmd === 'stop_recording') stopRecording();
    } catch {}
  };
}

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    feedbackEl.textContent = '浏览器不支持语音识别';
    feedbackEl.className = 'feedback err';
    return;
  }
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    feedbackEl.textContent = 'WebSocket 未连接';
    feedbackEl.className = 'feedback err';
    return;
  }
  if (isRecording) return;

  finalTranscript = '';
  isRecording = true;
  setStatus('recording', '录音中...');
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';

  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  recognition.continuous = true;

  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalTranscript += t;
      else interim = t;
    }
    textInput.value = finalTranscript + interim;
  };

  recognition.onerror = (e) => {
    console.error('recognition error:', e.error);
    if (isRecording) stopRecording();
  };

  recognition.onend = () => {
    if (isRecording) {
      try { recognition.start(); } catch {}
    }
  };

  try { recognition.start(); } catch {}
}

function stopRecording() {
  if (!isRecording || !recognition) return;
  isRecording = false;
  try { recognition.stop(); } catch {}
  recognition = null;

  setStatus('connected', '已连接');

  const text = finalTranscript.trim();
  if (!text) return;

  textInput.value = text;

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'transcript', text }));
    addHistory(text);
    feedbackEl.textContent = '';
    textInput.value = '';
    textInput.focus();
  }
}

connectWS();

sendBtn.addEventListener('click', async () => {
  const text = textInput.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  feedbackEl.textContent = '发送中...';
  feedbackEl.className = 'feedback';
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    const resp = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    const data = await resp.json();
    if (data.ok) {
      feedbackEl.textContent = '';
      addHistory(text);
      textInput.value = '';
      textInput.focus();
    } else {
      feedbackEl.textContent = '失败: ' + (data.error || '');
      feedbackEl.className = 'feedback err';
    }
  } catch (err) {
    feedbackEl.textContent = err.name === 'AbortError' ? '请求超时' : '网络错误';
    feedbackEl.className = 'feedback err';
  }
  sendBtn.disabled = false;
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});
</script>
</body>
</html>
