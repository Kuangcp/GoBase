<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Voice Drop</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4A90D9">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #16213e;
    color: #eee;
    font-size: 18px;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #4A90D9; }
  input::placeholder { color: #555; }
  .send-btn {
    padding: 14px 20px;
    border-radius: 8px;
    border: none;
    background: #4A90D9;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .send-btn:active { background: #357ABD; }
  .send-btn:disabled { opacity: 0.4; }
  .feedback {
    font-size: 14px;
    text-align: center;
    min-height: 20px;
  }
  .feedback.ok { color: #2ecc71; }
  .feedback.err { color: #e74c3c; }
  .hint {
    font-size: 13px;
    color: #555;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="input-row">
    <input type="text" id="textInput" placeholder="输入文字..." autofocus>
    <button class="send-btn" id="sendBtn">发送</button>
  </div>
  <div class="feedback" id="feedback"></div>
</div>

<script>
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const feedbackEl = document.getElementById('feedback');

sendBtn.addEventListener('click', async () => {
  const text = textInput.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  feedbackEl.textContent = '发送中...';
  feedbackEl.className = 'feedback';
  try {
    const resp = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await resp.json();
    if (data.ok) {
      feedbackEl.textContent = '已发送';
      feedbackEl.className = 'feedback ok';
      textInput.value = '';
      textInput.focus();
    } else {
      feedbackEl.textContent = '失败: ' + (data.error || '');
      feedbackEl.className = 'feedback err';
    }
  } catch (err) {
    feedbackEl.textContent = '网络错误';
    feedbackEl.className = 'feedback err';
  }
  sendBtn.disabled = false;
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});
</script>
</body>
</html>
